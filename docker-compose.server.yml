services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robomotion
      POSTGRES_USER: robomotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robomotion -d robomotion"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes: [minio-data:/data]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma migrate deploy
    environment: &worker-environment
      DATABASE_URL: postgresql://robomotion:${POSTGRES_PASSWORD}@postgres:5432/robomotion?schema=public
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      ROBOMOTION_MODEL_CACHE: /models
      ROBOMOTION_PROMPTHMR_ROOT: /opt/prompt-hmr
      ROBOMOTION_GMR_ROOT: /opt/gmr
      ROBOMOTION_TRAIN_ROOT: /opt/unitree-rl-mjlab
      ROBOMOTION_PROMPTHMR_ENV: phmr_pt2.4
      ROBOMOTION_GMR_ENV: gmr
      ROBOMOTION_DASHBOARD_URL: http://app:3000
      ROBOMOTION_TRAIN_ENV: unitree_rl_mjlab
      ROBOMOTION_POSE_MAX_HEIGHT: ${ROBOMOTION_POSE_MAX_HEIGHT:-480}
      ROBOMOTION_POSE_FPS: ${ROBOMOTION_POSE_FPS:-12}
      ROBOMOTION_POSE_MAX_FRAMES: ${ROBOMOTION_POSE_MAX_FRAMES:-180}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: postgresql://robomotion:${POSTGRES_PASSWORD}@postgres:5432/robomotion?schema=public
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      ROBOMOTION_MODEL_CACHE: /models
    volumes:
      - model-cache:/models
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-bootstrap:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gpu-worker
    command: ["bash", "deploy/bootstrap-models.sh"]
    environment:
      <<: *worker-environment
      SMPLX_USERNAME_FILE: /run/secrets/smplx_username
      SMPLX_PASSWORD_FILE: /run/secrets/smplx_password
      SMPL_USERNAME_FILE: /run/secrets/smpl_username
      SMPL_PASSWORD_FILE: /run/secrets/smpl_password
    secrets: [smplx_username, smplx_password, smpl_username, smpl_password]
    volumes:
      - model-cache:/models
      - conda-envs:/opt/conda/envs
    gpus: all
    shm_size: ${GPU_SHM_SIZE:-8gb}
    profiles: [gpu]
    depends_on:
      migrate: { condition: service_completed_successfully }

  motion-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gpu-worker
    command: ["bash", "deploy/start-gpu-worker.sh"]
    restart: unless-stopped
    init: true
    environment:
      <<: *worker-environment
      ROBOMOTION_WORKER_ID: local-pipeline-worker-motion
      ROBOMOTION_WORKER_STAGES: pose_extraction,robot_retargeting,visualization
      NVIDIA_VISIBLE_DEVICES: ${ROBOMOTION_MOTION_GPU:-all}
    volumes:
      - model-cache:/models
      - conda-envs:/opt/conda/envs
    gpus: all
    shm_size: ${GPU_SHM_SIZE:-8gb}
    profiles: [gpu]
    depends_on:
      model-bootstrap: { condition: service_completed_successfully }
      app: { condition: service_healthy }
      minio: { condition: service_started }

  training-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gpu-worker
    command: ["bash", "deploy/start-gpu-worker.sh"]
    restart: unless-stopped
    init: true
    environment:
      <<: *worker-environment
      ROBOMOTION_WORKER_ID: local-pipeline-worker-training
      ROBOMOTION_WORKER_STAGES: training
      NVIDIA_VISIBLE_DEVICES: ${ROBOMOTION_TRAINING_GPU:-all}
    volumes:
      - model-cache:/models
      - conda-envs:/opt/conda/envs
    gpus: all
    shm_size: ${GPU_SHM_SIZE:-8gb}
    profiles: [gpu]
    depends_on:
      model-bootstrap: { condition: service_completed_successfully }
      app: { condition: service_healthy }
      minio: { condition: service_started }

  artifact-export-worker:
    build:
      context: .
      dockerfile: control-plane/Dockerfile.services
    command: ["npm", "run", "worker:export"]
    restart: unless-stopped
    init: true
    environment:
      <<: *worker-environment
      ROBOMOTION_EXPORT_WORKER_ID: control-artifact-export-worker
      ROBOMOTION_DIGITAL_TWIN_FPS: ${ROBOMOTION_DIGITAL_TWIN_FPS:-60}
      ROBOMOTION_DIGITAL_TWIN_CRF: ${ROBOMOTION_DIGITAL_TWIN_CRF:-15}
    volumes:
      - model-cache:/models:ro
    profiles: [gpu]
    depends_on:
      model-bootstrap: { condition: service_completed_successfully }
      app: { condition: service_healthy }
      minio: { condition: service_started }

volumes:
  postgres-data:
  minio-data:
  model-cache:
  conda-envs:

secrets:
  smplx_username: { file: "${SMPLX_USERNAME_SECRET_FILE}" }
  smplx_password: { file: "${SMPLX_PASSWORD_SECRET_FILE}" }
  smpl_username: { file: "${SMPL_USERNAME_SECRET_FILE}" }
  smpl_password: { file: "${SMPL_PASSWORD_SECRET_FILE}" }
