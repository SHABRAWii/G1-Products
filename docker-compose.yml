services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robomotion
      POSTGRES_USER: robomotion
      POSTGRES_PASSWORD: robomotion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robomotion -d robomotion"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: robomotion
      MINIO_ROOT_PASSWORD: robomotion-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
